name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install tooling
        run: python -m pip install --upgrade pip pyflakes

      - name: Lint (pyflakes)
        run: python -m pyflakes ytdlp_gui tests yt_dlp_gui.py

      - name: Unit tests (pure logic)
        run: python -m unittest discover -s tests -t . -v

      - name: Import smoke test
        run: python -c "import ytdlp_gui, ytdlp_gui.app, ytdlp_gui.cli; print(ytdlp_gui.__version__)"

      - name: GUI construction smoke test (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import tkinter as tk; from ytdlp_gui import App; r=tk.Tk(); a=App(r); r.update(); r.destroy(); print('gui ok')"

      - name: GUI construction smoke test (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -c "import tkinter as tk; from ytdlp_gui import App; r=tk.Tk(); a=App(r); r.update(); r.destroy(); print('gui ok')"
